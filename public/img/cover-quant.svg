  </linearGradient>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<g opacity=".12" stroke="#F3DE9E">
  <path d="M0 100h800M0 200h800M0 300h800M0 400h800M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
</g>
<!-- Window frame -->
<rect x="82" y="54" width="636" height="392" rx="18" fill="#fffaf0"/>
<rect x="82" y="54" width="636" height="44" rx="18" fill="#efe3c6"/>
